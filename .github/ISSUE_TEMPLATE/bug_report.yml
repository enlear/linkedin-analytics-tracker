name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "⚠️ **Never attach your LinkedIn export** — it contains personal data. Describe it instead."
  - type: dropdown
    id: where
    attributes:
      label: Which version, and where are you running it?
      options:
        - Personal — the hosted site (enlear.github.io)
        - Personal — my own GitHub Pages copy
        - Personal — locally (npm run dev)
        - Team — deployed (Netlify, Vercel or other)
        - Team — locally (npm run dev)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open …\n2. Upload …\n3. See error …"
  - type: input
    id: env
    attributes:
      label: Browser / OS (and Node version if running locally)
