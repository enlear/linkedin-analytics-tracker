name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "⚠️ **Never attach your LinkedIn export** — it contains personal data. Describe it instead."
  - type: dropdown
    id: where
    attributes:
      label: Where are you running it?
      options: [The hosted site (enlear.github.io), Locally (npm run dev), My own GitHub Pages copy]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open …\n2. Upload …\n3. See error …"
  - type: input
    id: env
    attributes:
      label: Browser / OS (and Node version if running locally)
