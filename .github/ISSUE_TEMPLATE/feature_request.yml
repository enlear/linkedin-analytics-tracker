name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: dropdown
    id: version
    attributes:
      label: Which version?
      options: [Personal, Team, Both]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
