name: Keep the team database awake

# Free Supabase projects pause after a week with no activity (they restore with
# one click, but the app is down until someone does). A team that uploads
# regularly never hits this; this ping covers holidays and quiet months.
#
# Optional and off until configured: Settings → Secrets and variables →
# Actions → Variables → add SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY (both are
# public values). GitHub stops scheduled workflows in repos with no commits for
# 60 days; re-enable it from the Actions tab if that happens.
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY variables aren't set; nothing to do."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}'
